<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex" />
  <title>TOMI</title>
  <meta name="description" content="TOMI: ארבעה דגמים, עשרות טעמים. בוחרים דגם, מסובבים את גלגל הטעמים ומזמינים. למבוגרים מעל גיל 18 בלבד." />
  <meta name="theme-color" content="#6b34b8" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230e0d0c'/%3E%3Ccircle cx='32' cy='32' r='19' fill='none' stroke='%23e83e7a' stroke-width='7'/%3E%3Crect x='27' y='15' width='10' height='34' rx='5' fill='%23fff8ef'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;800&family=Karantina:wght@400;700&display=swap" rel="stylesheet" />
  <script type="module" crossorigin src="/assets/index-Ci-iogGv.js"></script>
  <link rel="stylesheet" crossorigin href="/assets/index-DD8vXL23.css">
  <!-- ydx: loading screen critical CSS (paints before anything else) -->
  <style data-ydx>
    .loader{display:none!important}
    .ydx-loader{position:fixed;inset:0;z-index:70;display:grid;place-items:center;align-content:center;gap:clamp(10px,2vh,22px);padding:24px;color:var(--ydx-lf,#fff8ef);background:radial-gradient(circle at 50% 44%,#fff8ef14 0 15%,#fff8ef0d 15.1% 30%,#fff8ef08 30.1% 48%,#fff8ef04 48.1% 68%,transparent 68.1%),radial-gradient(120% 70% at 50% 42%,var(--ydx-l1,#8152c4) 0%,var(--ydx-l2,#6b34b8) 46%,var(--ydx-l3,#331958) 100%);clip-path:inset(0 0 0 0);font-family:"Karantina","Arial Narrow",sans-serif;-webkit-user-select:none;user-select:none}
    .ydx-loader[hidden]{display:none}
    .ydx-mark{width:clamp(190px,34vmin,300px);height:auto;overflow:visible}
    .ydx-mark .t{fill:none;stroke:currentColor;stroke-opacity:.16;stroke-width:5}
    .ydx-mark .r{fill:none;stroke:var(--ydx-acc,#e83e7a);stroke-width:7;stroke-linecap:round;stroke-dasharray:0 100;transform:rotate(-90deg);transform-origin:100px 100px}
    .ydx-mark .w{fill:none;stroke:currentColor;stroke-width:1.3;stroke-opacity:.62;stroke-linecap:round}
    .ydx-mark .m{stroke-opacity:.32}
    .ydx-mark .s{fill:#fff8ef}.ydx-mark .k{fill:#0e0d0c}
    .ydx-count{margin:0;display:flex;align-items:baseline;direction:ltr;font-weight:700;font-size:clamp(52px,8vw,92px);line-height:.8;font-variant-numeric:tabular-nums}
    .ydx-count i{font-style:normal;font-size:.42em;opacity:.6;margin-inline-start:2px}
    .ydx-cap{margin:0;font:700 11px/1 "Assistant",system-ui,sans-serif;letter-spacing:.32em;text-transform:uppercase;opacity:.62}
    .ydx-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
    html.ydx-load body{background:var(--ydx-l3,#331958)}
    .ydx-mark .tp{fill:#e6d9c4}
    .ydx-count>*{transition:opacity .35s}
    html.ydx-load:not(.ydx-f) .ydx-count>*{opacity:0}
    html.ready .ydx-loader:not(.ydx-ctl){clip-path:inset(0 0 100% 0);visibility:hidden;transition:clip-path .9s cubic-bezier(.22,1,.36,1),visibility 0s .9s}
  </style>
  <noscript><style>.ydx-loader{display:none}</style></noscript>
  <!-- ydx: loader colour + flags + controller. External, not inline: the live CSP (script-src 'self') blocks inline scripts. Sync on purpose: tiny, and it must run before first paint. -->
  <script src="/ydx/boot.js"></script>
  <link rel="stylesheet" href="/ydx/enhance.css"><!-- ydx -->
  <script src="/ydx/enhance.js" defer></script><!-- ydx -->
</head>
<body>
  <!-- ydx: brand loader (TOMI mark: device wireframe filling solid inside the ring). Progress mirrors the app's own .loader-n counter. -->
  <div class="ydx-loader" role="status" aria-live="polite">
    <span class="ydx-sr">TOMI · Loading / טוען</span>
    <svg class="ydx-mark" viewBox="0 0 200 200" aria-hidden="true" focusable="false">
      <defs>
        <clipPath id="ydx-dev"><path d="M94 34h12a6 6 0 0 1 6 6v24h-24v-24a6 6 0 0 1 6-6z"/><path d="M92 62h16a14 14 0 0 1 14 14v78a14 14 0 0 1-14 14h-16a14 14 0 0 1-14-14v-78a14 14 0 0 1 14-14z"/></clipPath>
        <clipPath id="ydx-lvl"><rect class="ydx-lv" x="0" y="168" width="200" height="200"/></clipPath>
      </defs>
      <circle class="t" cx="100" cy="100" r="88"/>
      <circle class="r" cx="100" cy="100" r="88" pathLength="100"/>
      <g clip-path="url(#ydx-dev)">
        <g class="ydx-mer"><line class="w m" x1="100" y1="60" x2="100" y2="170"/><line class="w m" x1="100" y1="60" x2="100" y2="170"/><line class="w m" x1="100" y1="60" x2="100" y2="170"/><line class="w m" x1="100" y1="60" x2="100" y2="170"/></g>
        <g clip-path="url(#ydx-lvl)"><rect class="s" x="70" y="30" width="60" height="140"/><rect class="k" x="86" y="30" width="28" height="33"/><rect class="k" x="95" y="80" width="10" height="56" rx="5"/></g>
        <ellipse class="tp ydx-top" cx="100" cy="168" rx="22" ry="4" style="opacity:0"/>
      </g>
      <g class="ydx-wire">
        <path class="w" pathLength="1" d="M94 34h12a6 6 0 0 1 6 6v24h-24v-24a6 6 0 0 1 6-6z"/>
        <path class="w" pathLength="1" d="M92 62h16a14 14 0 0 1 14 14v78a14 14 0 0 1-14 14h-16a14 14 0 0 1-14-14v-78a14 14 0 0 1 14-14z"/>
        <path class="w" pathLength="1" d="M78 96a22 4 0 0 0 44 0M78 124a22 4 0 0 0 44 0M78 150a22 4 0 0 0 44 0M88 50a12 2.5 0 0 0 24 0"/>
        <rect class="w" pathLength="1" x="95" y="80" width="10" height="56" rx="5"/>
        <ellipse class="w ydx-surf" cx="100" cy="168" rx="22" ry="4" style="stroke-opacity:0"/>
      </g>
    </svg>
    <p class="ydx-count" aria-hidden="true"><b>0</b><i>%</i></p>
    <p class="ydx-cap" aria-hidden="true">TOMI</p>
  </div>
  <div class="loader" aria-live="polite"><span class="loader-n">0</span><i>%</i></div>
  <header class="top">
    <a class="brand" href="#" aria-label="TOMI">TOMI</a>
    <nav class="nav" aria-label="primary"><a href="#/shop" data-page="shop" data-t="nav.0"></a><a href="#" class="nav-models" data-t="nav.1"></a><a href="#/compare" data-page="compare" data-t="nav.2"></a><a href="#/guide" data-page="guide" data-t="nav.3"></a></nav>
    <div class="tools">
      <button class="lang" type="button" data-t="lang"></button>
      <a class="acct-link" href="#/account" data-page="account" data-t="account"></a>
      <button class="menu-btn" type="button" data-t="menu"></button>
      <button class="cart" type="button"><span data-t="cart"></span> (<span class="cart-n">0</span>)</button>
    </div>
  </header>



  <main>
    <div class="track">
    <section class="stage" aria-label="TOMI">
      <div class="flood" aria-hidden="true"></div>
      <div class="rings" aria-hidden="true"><b class="ripple"></b></div>
      <div class="sweep" aria-hidden="true"></div>
      <div class="detail-head" hidden><p class="detail-eyebrow"></p><h2 class="detail-title"></h2></div>
      <canvas class="gl" aria-hidden="true"></canvas>
      <div class="dial-host" data-lenis-prevent></div>

      <!-- carousel (hero) UI -->
      <div class="carousel-ui">
        <div class="hero-copy">
          <p class="eyebrow"><span data-t="choose"></span> <span class="hero-index"></span></p>
          <h1 class="model-name"></h1>
          <p class="hero-line" data-t="heroLine"></p>
          <button class="cta" type="button"><span data-t="enter"></span><svg class="cta-arrow" width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M2 7h10M8 3l4 4-4 4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
          <p class="unverified" hidden data-t="unverified"></p>
        </div>
        <dl class="hero-stats"></dl>
        <div class="hero-nav">
          <button class="arrow prev" type="button" aria-label="previous">←</button>
          <div class="pips" role="tablist"></div>
          <button class="arrow next" type="button" aria-label="next">→</button>
        </div>
      </div>

      <!-- dial UI -->
      <aside class="panel" aria-live="polite" hidden>
        <div class="panel-top">
          <button class="back" type="button"><span aria-hidden="true">←</span> <span data-t="back"></span></button>
          <button class="all-btn" type="button"><svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M1 1h5v5H1zM8 1h5v5H8zM1 8h5v5H1zM8 8h5v5H8z" fill="currentColor"/></svg><span data-t="all"></span></button>
        </div>
        <p class="panel-model"></p>
        <h2 class="fl-name"></h2>
        <p class="fl-sub"></p>
        <p class="fl-notes"></p>
        <dl class="facts"></dl>
        <div class="buy">
          <p class="price"><span class="price-n"></span></p>
          <button class="add" type="button"><span class="add-label" data-t="add"></span></button>
        </div>
        <div class="dial-step">
          <button class="arrow fprev" type="button" aria-label="previous flavour">←</button>
          <button class="arrow fnext" type="button" aria-label="next flavour">→</button>
        </div>
        <div class="panel-foot">
          <button class="details-btn" type="button"><span data-t="details"></span> <span class="flip" aria-hidden="true">→</span></button>
          <p class="hint" data-t="drag"></p>
        </div>
      </aside>

      <!-- flavour page -->
      <div class="detail" hidden>
        <div class="detail-info">
          <div class="detail-nav">
            <button class="detail-back" type="button"><span class="flip" aria-hidden="true">←</span> <span data-t="backDial"></span></button>
            <button class="all-btn detail-all" type="button"><svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M1 1h5v5H1zM8 1h5v5H8zM1 8h5v5H1zM8 8h5v5H8z" fill="currentColor"/></svg><span data-t="all"></span></button>
          </div>
          <p class="detail-notes"></p>
          <dl class="detail-facts"></dl>
        </div>
        <div class="detail-buy">
          <p class="detail-sub"></p>
          <p class="price"><span class="detail-price"></span></p>
          <button class="add" type="button"><span class="add-label" data-t="add"></span></button>
          <div class="detail-step">
            <button class="arrow dprev" type="button" aria-label="previous flavour">←</button>
            <span class="detail-count"></span>
            <button class="arrow dnext" type="button" aria-label="next flavour">→</button>
          </div>
        </div>
      </div>

    </section>
    </div>

    <div class="home"></div>

    <section class="specs" aria-live="off"></section>
  </main>
  <div class="pages" hidden></div>

  <!-- simple flavour view -->
  <div class="sheet" role="dialog" aria-modal="true" hidden data-lenis-prevent>
    <header class="sheet-head">
      <div><p class="sheet-model"></p><h2 class="sheet-title" data-t="all"></h2></div>
      <button class="sheet-close" type="button"><span data-t="close"></span> ✕</button>
    </header>
    <div class="sheet-body" data-layout="list"></div>
  </div>
</body>
</html>
